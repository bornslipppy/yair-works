,"link_2":"https://ob-hybrid-demo.onrender.com/","linklabel_2":"Prototype","title_3":"Agentic Product Design / 2026","desc_3":"I built Guesty’s most comprehensive product knowledge layer, then used it to establish a BMAD-based, spec-driven process that takes agents from product brief to coded design.","problem_3":"Designers manually produced every screen, making execution the bottleneck. Product judgment couldn’t scale, and moving from brief to working design took weeks.","impact_3":"2 weeks → 3 days concept turnaround · no Figma in the loop","note_3":"Coming Soon","title_4":"Brad / 2026","desc_4":"Brad is an autonomous product-judgment agent that triages stakeholder feedback, resolves decisions with evidence, and escalates only issues requiring human judgment.","problem_4":"Routine feedback and design reviews consumed senior design time. Context was fragmented, decisions were inconsistent, and one person became the quality bottleneck.","impact_4":"Reclaimed 15+ hours per week and avoided approximately $10K per month in external design review, with decision quality blind-evaluated against a memory-only baseline.","note_4":"Coming Soon","title_5":"Agentic Workshop / 2026","desc_5":"A hands-on workshop teaching designers to turn a cold brief into a coded prototype using structured context, BMAD specs, specialist agents, and continuous UX review.","problem_5":"Designers were experimenting with AI tools without a repeatable process for preserving context, directing agents, or producing implementation-ready work.","impact_5":"Enabled 100+ designers to move from a cold brief to a shareable prototype in no time. NPS 70.","link_5":"https://no-figma.com/","linklabel_5":"Workshop","title_6":"Advisor / 2026","desc_6":"Advise founders on product strategy, narrative, fundraising and sales decks. Clients include <a href=\"https://getgain.com/\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color:inherit;text-decoration:underline;text-underline-offset:2px\">Gain</a> (AI employees for procurement), <a href=\"https://www.sunlightapi.com/\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color:inherit;text-decoration:underline;text-underline-offset:2px\">Sunlight</a> (B2B card-payment automation, YC-backed), <a href=\"https://pumbaparking.com/\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color:inherit;text-decoration:underline;text-underline-offset:2px\">Pumba</a> (computer-vision street parking), <a href=\"https://www.guesty.com/\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color:inherit;text-decoration:underline;text-underline-offset:2px\">Guesty</a>, and <a href=\"https://www.trigoretail.com/\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color:inherit;text-decoration:underline;text-underline-offset:2px\">Trigo</a>.","impact_6":"Successful fundraising efforts exceeding $500M.","link_6":"https://carousel-project-ten.vercel.app/","linklabel_6":"Showcase","title_7":"Unified Inbox (Guesty) / 2026","desc_7":"I reimagined Guesty’s Unified Inbox as a reservation-led workspace that unifies communication, operational context, team coordination, and AI in one surface.","problem_7":"The inbox worked like a mailbox, but growing property-management teams needed an operational control center. Urgent requests were missed, ownership was unclear, replies were duplicated, and agents had to switch modules to understand each reservation.","impact_7":"Reduced handling time by 28% and cross-module steps by 35%.","link_7":"https://guesty-unified-inbox.vercel.app/","linklabel_7":"Case Study","title_8":"Business Models (Guesty) / 2026","desc_8":"I led the redesign of Guesty’s financial configuration, replacing fragmented tools with a unified system built around clear defaults, explicit bulk actions, payout previews, and version history.","problem_8":"Customers duplicated entire Business Models to change a single rule. Without bulk operations, visibility, or change history, managing commissions and payouts at scale was inefficient and financially risky.","impact_8":"Achieved 88% migration in three months against a 75% target, reduced support tickets by 50%, doubled accounting-tier upgrades, and reduced Business Models per account by 22%.","link_8":"https://guesty-business-models.vercel.app/","linklabel_8":"Case Study","title_9":"Booking Engine (Guesty) / 2025","desc_9":"I reframed Guesty’s Booking Engine as a conversion layer and defined a unified, mobile-first journey from property evaluation to payment—built for customization, enterprise portfolios, and agent-assisted booking.","problem_9":"Three separate, underperforming engines created a fragmented guest journey and cost property managers direct-booking revenue. Testing found filtering problems for ~40% of users and payment difficulties for ~20%, alongside weak customization, trust signals, and enterprise scalability.","impact_9":"Increase search-to-confirmation conversion by 18%, reduce checkout abandonment by 30%, and cut filtering and payment failures by 50%.","link_9":"https://guesty-booking-engine.vercel.app/","linklabel_9":"Case Study","title_10":"Global Nav (Guesty) / 2025","desc_10":"I re-architected Guesty’s global navigation around user jobs instead of product structure, combining a flatter hierarchy with adaptive Quick Access and user-controlled personalization.","problem_10":"Frequently used tools were buried in deep menus organized around internal teams and features. Users had to hunt across tabs, increasing click depth, context switching, and time spent completing everyday workflows.","impact_10":"Reduced time-to-task by 25% and navigation clicks by 30% across core workflows, while improving feature discovery by 20% and driving 35% adoption of personalized Quick Access.","link_10":"https://guesty-global-navigation.vercel.app/","linklabel_10":"Case Study","title_11":"Alike Health / 2024","desc_11":"I led product and design for Alike, a 200K-user healthcare community that used AI-powered patient similarity to connect   const underline = document.querySelector(".mode-underline");
  const colorText = document.querySelector(".mode-active");
  const calmText = document.querySelector(".mode-inactive");
  const STORAGE_KEY = "obys-color-mode";
  let isCalm = false;

  function setBackground(color) {
    document.body.style.backgroundColor = color;
    const pageWrapper = document.querySelector(".page-wrapper");
    const mainFrame = document.querySelector(".main-frame");
    if (pageWrapper) pageWrapper.style.backgroundColor = color;
    if (mainFrame) mainFrame.style.backgroundColor = color;
  }

  function moveUnderlineTo(target) {
    if (!underline || !target) return;
    underline.style.left = `${target.offsetLeft}px`;
    underline.style.width = `${target.offsetWidth}px`;
  }

  function applyMode() {
    if (isCalm) {
      moveUnderlineTo(calmText);
      if (window.showPride) window.showPride();
    } else {
      moveUnderlineTo(colorText);
      if (window.hidePride) window.hidePride();
      setBackground("#FFFFFF");
    }
  }

  applyMode();
  if (!toggle) return;
  toggle.addEventListener("click", () => {
    isCalm = !isCalm;
    localStorage.setItem(STORAGE_KEY, isCalm ? "calm" : "color");
    applyMode();
  });
});
</script>
